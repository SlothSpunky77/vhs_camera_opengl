name: vhs_camera
description: "A lightweight, fully manual VHS camcorder. Real-time GPU tape emulation for photos and video."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Live sensor preview plus manual focus / zoom / exposure controls.
  camera: ^0.12.0+2
  # Feeds a widget subtree into a FragmentShader as a sampler.
  flutter_shaders: ^0.1.3
  # Hardware H.264 muxing (MediaCodec / AVFoundation) from raw RGBA + PCM.
  flutter_quick_video_encoder: ^1.7.2
  # Raw PCM microphone stream for the video's audio track.
  record: ^7.1.1
  # Writes finished captures into the system gallery.
  gal: ^2.3.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Compiled ahead of time by the Flutter tool into the engine shader format.
  shaders:
    - shaders/vhs.frag
